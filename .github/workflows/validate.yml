name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: Validate with the pinned OpenAI plugin schema
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          curl -fsSL \
            https://raw.githubusercontent.com/openai/codex/0dfa778dae6a94b2ff2c69176cbaf063a3bf18a1/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py \
            -o "$RUNNER_TEMP/validate_plugin.py"
          python3 "$RUNNER_TEMP/validate_plugin.py" .
